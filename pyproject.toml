[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-relay"
version = "0.1.0"
description = "Stdlib-only supervisor that rotates a headless Claude Code workload across seats as each account's 5-hour usage window fills up."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dias Bakhtiyarov" }]
keywords = ["claude", "claude-code", "gad-kit", "supervisor", "rotation", "headless"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/lgblkb/claude-relay"
Repository = "https://github.com/lgblkb/claude-relay"
Issues = "https://github.com/lgblkb/claude-relay/issues"

[project.scripts]
claude-relay = "relay.cli:main"

[tool.setuptools]
packages = ["relay"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
  "S603", # subprocess call with a fixed, non-shell argv (git/claude) — reviewed at each call site
  "S607", # partial executable path ("git", "claude") — resolved via PATH deliberately (portability)
  "S105", # "possible hardcoded password" false-positives on token_target's literal default ("+2M")
  "S106", # same false-positive, matched via keyword-argument form (test fixtures use Config(token_target=...))
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]
